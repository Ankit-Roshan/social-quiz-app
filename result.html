<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="result.css">
    <title>Document</title>
    <style>
        .performanceKeysa.excellent {
            color: #1bad20;
            /* green */
        }

        .performanceKeysa.good {
            color: #ff9800;
            /* orange */
        }

        .performanceKeysa.poor {
            color: #f44336;
            /* red */
        }
    </style>
</head>

<body>
    <div class="containerScore">

        <div class="topBoard">
            <div class="whichCat">
                <img src="./images/Abstract.jpg" alt="" class="winPhoto">
                <p class="winnerNam"></p>
            </div>

            <div class="scrBoard">
                <p>Score</p>
                <p><span class="finalScore" id="point1"></span></p>
                <p class="score">OUT OF <span class="totalQues"></span></p>

            </div>
            <div class="downloadSec">

                <img src="./images/download.png" alt="">
                <p class="dnld">View</p>
            </div>
        </div>


        <div class="report">

            <div class="longRow">
                <div class="leftPart">
                    <img src="./images/help.png" class="icon">
                    <span>Total Question:</span>
                </div>
                <span class="totalQues value"></span>
            </div>

            <div class="longRow">
                <div class="leftPart">
                    <img src="./images/check.png" class="icon">
                    <span>Correct Answers:</span>
                </div>
                <span class="finalScore value"></span>
            </div>

            <div class="longRow">
                <div class="leftPart">
                    <img src="./images/no.png" class="icon">
                    <span>Incorrect Answer:</span>
                </div>
                <span class="wrongScore value"></span>
            </div>

            <div class="longRow">
                <div class="leftPart">
                    <img src="./images/question-mark.png" class="icon">
                    <span>Not Attempted:</span>
                </div>
                <span class="unattempted value"></span>
            </div>

            <div class="longRow">
                <div class="leftPart">
                    <img src="./images/percent.png" class="icon">
                    <span>Percentage:</span>
                </div>
                <span class="percent value"></span>
            </div>
            <div class="perform">
                <p class="performanceKeysa"></p>

            </div>


            <div class="result-actions">
                <button class="homeBtn">Home</button>
                <button class="retryBtn">Retry</button>
            </div>
        </div>

    </div>
    <script>

        let downloadBtnm =document.querySelector(".dnld")
        downloadBtnm.addEventListener("click", ()=>{
            location.href ="certificate.html"
        })

        // let winner = localStorage.getItem("enteredName")
        let winnerNam = document.querySelector(".winnerNam")

        let categoryNam = localStorage.getItem("selectedCat")
        winnerNam.innerHTML = categoryNam.toUpperCase() + " Quiz"

        console.log(categoryNam);

        if (categoryNam === "cars") {
            document.querySelector(".winPhoto").src = "images/carDP.jpg"
        }else if(categoryNam === "cosmos"){
            document.querySelector(".winPhoto").src = "images/midjourney.jpg"

        }else if(categoryNam === "fastandfurious"){
            document.querySelector(".winPhoto").src = "images/dom.jpg"

        }else if(categoryNam === "pokemon"){
            document.querySelector(".winPhoto").src = "images/pokeball.jpg"

        }else if(categoryNam === "assamHistory"){
            document.querySelector(".winPhoto").src = "images/zappi1.jpg"

        }else if(categoryNam === "science"){
            document.querySelector(".winPhoto").src = "images/science.jpg"

        }else if(categoryNam === "gk"){
            document.querySelector(".winPhoto").src = "images/gklogo.jpg"

        }

        let totalQues = document.querySelectorAll(".totalQues")
        totalQues.forEach(tq => {
            tq.innerHTML = localStorage.getItem("totalKitna")
        })


        let finalScore = document.querySelectorAll(".finalScore")
        finalScore.forEach(el => {
            el.innerHTML = localStorage.getItem("scoreKitna")
        });

        let wrongScore = document.querySelector(".wrongScore")
        wrongScore.innerHTML = localStorage.getItem("galatKitna")

        let unattemptedQues = document.querySelector(".unattempted")
        unattemptedQues.innerHTML = localStorage.getItem("unattemp")

        let percenta = document.querySelectorAll(".percent")
        percenta.forEach(pr => {
            let p = parseFloat(localStorage.getItem("percentKitna"));
            pr.innerHTML = p.toFixed(0) + " %";
        });
        let finalPercent = localStorage.getItem("percentKitna")
        console.log(finalPercent);

        let performanceKeysa = document.querySelector(".performanceKeysa")
        if (finalPercent >= 75) {
            performanceKeysa.innerHTML = "Excellent"
            performanceKeysa.classList.add('excellent');
        } else if (finalPercent < 75 && finalPercent > 50) {
            performanceKeysa.innerHTML = "Good Effort!"
            performanceKeysa.classList.add('good');
        } else if (finalPercent < 50) {
            performanceKeysa.innerHTML = "Keep practicing!"
            performanceKeysa.classList.add('poor');
        }

        let homeBtn = document.querySelector(".homeBtn")
        let retryBtn = document.querySelector(".retryBtn")

        // retryBtn.addEventListener("click", ()=>{
        //     localStorage.removeItem("percentKitna")
        //     localStorage.removeItem("scoreKitna")
        //     localStorage.removeItem("galatKitna")
        //     localStorage.removeItem("unattemp")

        //     location.href ="questions.html"
        // })

        if (retryBtn) {
            retryBtn.addEventListener("click", () => {
                // Clear all quiz-related stored data
                localStorage.removeItem("percentKitna");
                localStorage.removeItem("scoreKitna");
                localStorage.removeItem("galatKitna");
                localStorage.removeItem("unattemp");

                // Redirect to quiz page
                location.href = "questions.html";
            });
        }

        homeBtn.addEventListener("click", () => {
            location.href = "index.html"

        })

    </script>
</body>

</html>
