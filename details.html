<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container{
            background: #a84b4b;
            height: 50vh;
            width: 60vw;

        }
    </style>
</head>
<body>
 <div class="container">
    <div class="nameWala">
        <p>Name: <input class="name" type="text" placeholder="Enter your name"></p>
    </div>
    <div class="start">
        <button class="str">Start</button>
    </div>
 </div>
 
 <script>
    let name = document.querySelector(".name")
    let start = document.querySelector(".str")
    
    start.addEventListener("click",()=>{
        localStorage.setItem("enteredName",name.value)
        location.href ="index.html"
    })
    

 </script>
</body>
</html>
